# RENDERED by `cargo xtask fleet render busbar-auth-admin-tokens` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/ templates; `cargo xtask fleet check` is red on any edit here. On a v* tag: this
# repo's CI on the tagged commit, then busbar's plugin-release.yml (build, sign, pack, publish), then
# the consumer verification of what was published, each at the busbar commit this repo pins.
name: release

on:
  push:
    tags: ["v*", "!v*-*"]
  # A tag pushed with GITHUB_TOKEN starts no workflow, so a workflow that tags dispatches this on
  # the tag ref (`gh workflow run release.yml --ref <tag>`).
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write
  issues: write
  actions: read

jobs:
  ci:
    uses: GetBusbar/busbar/.github/workflows/plugin-ci.yml@afc64b37c4d706729bfcd96cd234dfb4b16416a0
    with:
      service: none
      busbar_checkout: false
      macos_test: "cargo test --workspace --locked"
      extra_test: ""
    secrets: inherit
  release:
    needs: ci
    uses: GetBusbar/busbar/.github/workflows/plugin-release.yml@afc64b37c4d706729bfcd96cd234dfb4b16416a0
    with:
      plugin_crate: busbar-auth-admin-tokens-plugin
      manifest_name: busbar-auth-admin-tokens
      plugin_alias: admin-tokens
      plugin_kind: auth
      asset_prefix: busbar-auth-admin-tokens
      description: "First-party signed kind:auth plugin cdylib: the built-in admin-tokens admin-auth module (the single operator admin token, compared in constant time), packaged as a droppable busbar plugin."
      lib_only: false
      needs_prompt: ""
      needs_user: ""
      declares_file: "auth-admin-tokens/declares.json"
    secrets: inherit
  consumer-verify:
    needs: release
    if: ${{ !cancelled() }}
    uses: GetBusbar/busbar/.github/workflows/plugin-consumer-verify.yml@afc64b37c4d706729bfcd96cd234dfb4b16416a0
    with:
      version: ${{ github.ref_name }}
      asset_prefix: busbar-auth-admin-tokens
      plugin_name: busbar-auth-admin-tokens
      plugin_alias: admin-tokens
      plugin_kind: auth
      bundle_image: ""
      bundle_env: ""
    secrets: inherit
