[package]
name = "busbar-auth-admin-tokens"
version = "1.5.0"
publish = false            # linked into busbar at a pinned rev, or shipped as a signed tarball; never to crates.io
edition = "2021"
rust-version = "1.97"
description = "The built-in `admin-tokens` admin-auth plugin for busbar: the single operator admin token, compared in constant time across both carriers."
license = "Apache-2.0"

[lib]
# rlib only: the logic and its door. A build that LINKS this crate registers `door::door` as its
# `admin-tokens` row (no symbol is exported from here); the dropped-in cdylib is
# `busbar-auth-admin-tokens-plugin` (same repo), which exports the same door as `busbar_plugin_door`.
crate-type = ["rlib"]

[dependencies]
# The one busbar crate this plugin names (#40: a plugin depends on the contract only), pinned to the
# rev in the repo's `.busbar-ref`.
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "7a5b429041752e00375e120ab1547a8928c3dee4" }
# The settings document (a JSON string holding the digest).
serde_json = "1"
