# SPDX-License-Identifier: Apache-2.0
#
# RENDERED by `cargo xtask fleet render busbar-auth-admin-tokens` from GetBusbar/busbar's plugins.yaml and
# .github/fleet/workspace-Cargo.toml; `cargo xtask fleet check` is red on any edit here.
#
# One repo per plugin, every repo a twin: this workspace is exactly two crates, the logic
# (`auth-admin-tokens/`, the rlib a busbar build can link) and the thin cdylib that packages it as a
# droppable `kind: auth` plugin (`auth-admin-tokens-plugin/`, crate `busbar-auth-admin-tokens-plugin`). Its busbar
# dependencies are git dependencies on GetBusbar/busbar at the fleet pin (`.busbar-ref` field 1);
# no sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "auth-admin-tokens",
    "auth-admin-tokens-plugin",
]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
repository = "https://github.com/GetBusbar/busbar-auth-admin-tokens"

[workspace.dependencies]
busbar-contract = { git = "https://github.com/GetBusbar/busbar", rev = "afc64b37c4d706729bfcd96cd234dfb4b16416a0" }
busbar-plugin-loader = { git = "https://github.com/GetBusbar/busbar", rev = "afc64b37c4d706729bfcd96cd234dfb4b16416a0" }
