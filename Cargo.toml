# SPDX-License-Identifier: Apache-2.0
#
# One repo per plugin (owner ruling, busbar 1.6.0): this repo holds the built-in `admin-tokens`
# admin-auth module (busbar-auth-admin-tokens) — the single operator admin token, compared in constant
# time across both carriers. busbar's default build links it (the `auth-admin-tokens` feature) at a
# pinned rev; under its `dropped-in` feature the same crate's cdylib is a droppable `kind: auth`
# plugin.
#
# Its one busbar dependency is busbar-contract (busbar-plugin-loader too, dev-only for the
# conformance test), a git dependency on GetBusbar/busbar pinned to the rev in `.busbar-ref`
# field 1. No sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "auth-admin-tokens",
]
